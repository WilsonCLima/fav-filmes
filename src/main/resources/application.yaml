spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fav_filmes}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
tmdb:
  api:
    key: ${TMDB_API_KEY:}
    url: https://api.themoviedb.org/3
app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
logging:
  level:
    com.wilson.fav_filmes: INFO
